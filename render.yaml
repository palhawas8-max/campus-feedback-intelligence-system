services:
  # ─── FastAPI NLP Backend Web Service ─────────────────────────────────────────
  - type: web
    name: campus-feedback-api
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: chmod +x render_build.sh && ./render_build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGODB_URL
        value: mongodb+srv://palhawas8_db_user:VRZfOjitAr4LhjPz@cluster0.1bx8exf.mongodb.net/?retryWrites=true&w=majority
      - key: MONGODB_DB_NAME
        value: campus_feedback
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production

  # ─── React Vite Tailwind Frontend Static Site ──────────────────────────────
  - type: web
    name: campus-feedback-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://campus-feedback-api.onrender.com/api
